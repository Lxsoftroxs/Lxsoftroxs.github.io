<!-- _includes/footer.html -->
<footer class="site-footer">
  <form id="subscribe-form" novalidate aria-label="Email subscription">
    <label for="subscriber-email" class="sr-only">Email address</label>
    <input type="email" id="subscriber-email" placeholder="Enter your email" required>
    <!-- Honeypot for bots -->
    <input type="text" id="website" name="website" style="display:none" tabindex="-1" aria-hidden="true">
    <button type="submit">Subscribe</button>
  </form>
  <div id="subscribe-message" role="status" aria-live="polite"></div>
</footer>
