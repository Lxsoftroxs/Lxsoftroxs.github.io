---
layout: default
title: "Daily Journal"
permalink: /journal/
---
<h1>Daily Journal</h1>

<!-- Month Navigation Controls -->
<div id="calendar-controls" style="text-align:center; margin-bottom:10px;">
  <button id="prev-month" aria-label="Previous month">Previous Month</button>
  <span id="month-display" style="margin: 0 15px; font-weight:bold;" aria-live="polite"></span>
  <button id="next-month" aria-label="Next month">Next Month</button>
</div>

<div id="calendar" role="region" aria-label="Journal calendar" style="overflow-x: auto;"></div>

<!-- Journal entry data injected by Jekyll; consumed by journal-calendar.js -->
<script type="application/json" id="journal-data">
[
  {% for entry in site.journal %}
  {
    "date": "{{ entry.date | date: '%Y-%m-%d' }}",
    "title": "{{ entry.title | escape }}",
    "url": "{{ entry.url | relative_url }}"
  }{% unless forloop.last %},{% endunless %}
  {% endfor %}
]
</script>

<script defer src="{{ '/assets/js/journal-calendar.js' | relative_url }}"></script>
