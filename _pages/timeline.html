---
layout: default
title: "Life Timeline"
permalink: /timeline/
---

<div class="timeline-header">
  <h1>✨ Life Timeline ✨</h1>
  <p class="timeline-subtitle">A journey through time, memories, and moments that shaped me</p>
</div>

<!-- Stats -->
<div class="timeline-stats" aria-label="Timeline statistics">
  <div class="stat-item">
    <span class="stat-value" id="total-events">0</span>
    <span class="stat-label">Total Events</span>
  </div>
  <div class="stat-item">
    <span class="stat-value" id="years-span">0</span>
    <span class="stat-label">Years Documented</span>
  </div>
  <div class="stat-item">
    <span class="stat-value" id="milestones-count">0</span>
    <span class="stat-label">Milestones</span>
  </div>
</div>

<!-- Controls -->
<div class="timeline-controls" role="search" aria-label="Filter timeline events">
  <div class="search-container">
    <label for="timeline-search" class="sr-only">Search events</label>
    <input type="text" id="timeline-search" placeholder="🔍 Search events, people, places...">
  </div>

  <label for="category-filter" class="sr-only">Filter by category</label>
  <select id="category-filter">
    <option value="all">All Categories</option>
    <option value="birth">Birth &amp; Early Years</option>
    <option value="education">Education</option>
    <option value="travel">Travel</option>
    <option value="achievement">Achievement</option>
    <option value="relationship">Relationships</option>
    <option value="work">Work &amp; Career</option>
    <option value="creative">Creative Projects</option>
    <option value="milestone">Major Milestones</option>
    <option value="other">Other</option>
  </select>

  <button id="sort-asc" class="active" aria-pressed="true">Oldest First</button>
  <button id="sort-desc" aria-pressed="false">Newest First</button>
  <button id="show-all">Show All</button>
</div>

<!-- Timeline -->
<div class="timeline-container" role="region" aria-label="Life events timeline">
  <div class="timeline-line" aria-hidden="true"></div>
  <div id="timeline-events"></div>
</div>

<!-- Timeline data injected by Jekyll; consumed by timeline-app.js -->
<script type="application/json" id="timeline-data">
[
  {% for event in site.timeline %}
  {
    "id": "{{ forloop.index }}",
    "date": "{{ event.date | date: '%Y-%m-%d' }}",
    "title": {{ event.title | jsonify }},
    "summary": {{ event.summary | jsonify }},
    "details": {{ event.details | jsonify }},
    "category": {{ event.category | jsonify }},
    "milestone": {{ event.milestone | default: false }},
    "people": {{ event.people | jsonify | default: '[]' }},
    "location": {{ event.location | jsonify }},
    "media": {{ event.media | jsonify | default: '[]' }},
    "notes": {{ event.notes | jsonify }},
    "connections": {{ event.connections | jsonify | default: '[]' }},
    "age": {{ event.age | jsonify }}
  }{% unless forloop.last %},{% endunless %}
  {% endfor %}
]
</script>

<script defer src="{{ '/assets/js/timeline-app.js' | relative_url }}"></script>
