<div class="listen-wrap">
  <h1>🎧 Listening</h1>
  <p class="listen-meta">Live from Last.fm &mdash; shows "Now Playing" if you're currently listening.</p>

  <!-- Config injected via Jekyll at build time; key is a read-only Last.fm API key -->
  <div id="lastfm-config"
    data-user="{{ site.lastfm_user }}"
    data-key="{{ site.lastfm_api_key }}"
    aria-hidden="true"
    style="display:none;"></div>

  <div id="now-playing" class="listen-row" style="display:none;"></div>
  <div id="recent-list"></div>
</div>

<script defer src="{{ '/assets/js/listening.js' | relative_url }}"></script>
