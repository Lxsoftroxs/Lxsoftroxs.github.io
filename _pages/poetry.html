---
layout: default
title: "Poetry Collection"
permalink: /poetry/
---

<h1>Poetry Collection</h1>

<ul class="poetry-list">
  {% for poem in site.poetry %}
    <li>
      <a href="{{ poem.url }}">{{ poem.title }}</a><span class="date">{{ poem.date | date: "%B %-d, %Y" }}</span>
    </li>
  {% endfor %}
</ul>
