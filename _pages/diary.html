---
layout: default
title: "Diary"
permalink: /diary/
---

<div class="diary-page">
  <h1 class="diary-title">Diary Photos</h1>
  <div class="diary-gallery" id="diary-gallery" aria-label="Diary photo gallery"></div>
</div>

<!-- Photo metadata injected at build time; diary-virtual.js renders on demand -->
<script type="application/json" id="diary-data">
[{% for p in site.data.diary_photos %}{"id":"{{ p.id }}","src":"{{ p.src | relative_url }}","caption":"{{ p.caption | escape }}"}{% unless forloop.last %},{% endunless %}{% endfor %}]
</script>

<script defer src="{{ '/assets/js/diary.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/diary-virtual.js' | relative_url }}"></script>
