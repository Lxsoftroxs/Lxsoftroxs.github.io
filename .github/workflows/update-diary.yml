name: Update Diary Photos

on:
  # ✅ Manual trigger button in the Actions tab
  workflow_dispatch:

  # ✅ Automatic trigger when photos or script change
  push:
    paths:
      - 'assets/diary/**'
      - '.github/scripts/update_diary.py'

permissions:
  contents: write  # needed for committing back to repo

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      # Optional: image optimization before renaming
      # - name: Optimize images (ImageMagick)
      #   run: sudo apt-get update && sudo apt-get install -y imagemagick && \
      #        mogrify -resize 1600x1600\> -quality 85 assets/diary/*.{jpg,jpeg,png}

      - name: Run diary updater
        run: python .github/scripts/update_diary.py

      - name: Commit & push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update diary photos"
          commit_user_name: github-actions
          commit_user_email: actions@github.com
          push_options: '--force'
          token: ${{ secrets.GITHUB_TOKEN }}
