name: Update Diary Photos

on:
  # ✅ Manual trigger button in the Actions tab
  workflow_dispatch:

  # ✅ Automatic trigger when photos or script change
  push:
    paths:
      - 'assets/diary/**'
      - '.github/scripts/update_diary.py'

permissions:
  contents: write  # needed for committing back to repo

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Optimize images (reduce size, keep quality)
        run: |
          # Optimize JPG/PNG images (max 1920px, quality 85, progressive JPEGs)
          for img in assets/diary/*.{jpg,jpeg,JPG,JPEG}; do
            [ -f "$img" ] || continue
            mogrify -resize 1920x1920\> -quality 85 -interlace Plane -strip "$img"
          done
          for img in assets/diary/*.{png,PNG}; do
            [ -f "$img" ] || continue
            mogrify -resize 1920x1920\> -strip "$img"
          done

          # Generate WebP versions for modern browsers
          for img in assets/diary/*.{jpg,jpeg,png,JPG,JPEG,PNG}; do
            [ -f "$img" ] || continue
            cwebp -q 85 "$img" -o "${img%.*}.webp" 2>/dev/null || true
          done

      - name: Run diary updater
        run: python .github/scripts/update_diary.py

      - name: Commit & push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update diary photos"
          commit_user_name: github-actions
          commit_user_email: actions@github.com
          push_options: '--force'
          token: ${{ secrets.GITHUB_TOKEN }}
