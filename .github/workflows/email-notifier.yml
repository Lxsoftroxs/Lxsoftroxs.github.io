name: Notify Subscribers of New Content

on:
  push:
    # Only run if a commit touches the _posts folder
    paths:
      - "_posts/**"
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Install msmtp (mail) and jq (JSON parsing)
      - name: Install msmtp and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y msmtp jq

      # 3. Configure msmtp with your Gmail credentials (stored in repo secrets)
      - name: Configure msmtp
        run: |
          cat <<EOF > ~/.msmtprc
          account default
          host smtp.gmail.com
          port 587
          auth on
          tls on
          tls_starttls on
          user ${{ secrets.EMAIL_USER }}
          password ${{ secrets.EMAIL_PASS }}
          from ${{ secrets.EMAIL_USER }}
          logfile ~/.msmtp.log
          EOF
          chmod 600 ~/.msmtprc

      # 4. Build the subscriber email list (comma-separated)
      - name: Fetch subscribers
        run: |
          if [ -f subscribers.json ]; then
            emails=$(jq -r '.[]' subscribers.json | paste -sd, -)
            echo "EMAIL_LIST=$emails" >> $GITHUB_ENV
          else
            echo "EMAIL_LIST=" >> $GITHUB_ENV
          fi

      # 5. Identify any brand-new post file added in THIS push
      - name: Detect new post
        id: detect
        run: |
          # Look for files added (A) between the previous and current commit
          NEW_POST=$(git diff --name-only --diff-filter=A "${{ github.event.before }}" "${{ github.sha }}" -- '_posts/*.md' | head -n1)

          if [ -z "$NEW_POST" ]; then
            echo "No new post added – skipping notification."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0    # Exit early (job succeeds, but later steps are skipped)
          fi

          # Extract post title from YAML front matter
          TITLE=$(grep -m1 '^title:' "$NEW_POST" | sed 's/^title:[[:space:]]*["'\'']\?\(.*\)["'\'']\?$/\1/')

          # Build URL: _posts/YYYY-MM-DD-slug.md → /YYYY/MM/DD/slug.html
          FILENAME=$(basename "$NEW_POST" .md)
          YEAR=$(echo "$FILENAME" | cut -d'-' -f1)
          MONTH=$(echo "$FILENAME" | cut -d'-' -f2)
          DAY=$(echo "$FILENAME" | cut -d'-' -f3)
          SLUG=$(echo "$FILENAME" | cut -d'-' -f4-)
          URL="https://lxsoftroxs.github.io/$YEAR/$MONTH/$DAY/$SLUG.html"

          echo "POST_TITLE=$TITLE"   >> $GITHUB_ENV
          echo "POST_URL=$URL"       >> $GITHUB_ENV
          echo "skip=false"          >> $GITHUB_OUTPUT

      # 6. Send the email (only if we found a new post AND there are subscribers)
      - name: Send notification email
        if: steps.detect.outputs.skip == 'false' && env.EMAIL_LIST != ''
        run: |
          cat <<EOF | msmtp -a default "${{ env.EMAIL_LIST }}"
          Subject: New Post: ${POST_TITLE}

          Check out the new post: "${POST_TITLE}"
          ${POST_URL}
          EOF
