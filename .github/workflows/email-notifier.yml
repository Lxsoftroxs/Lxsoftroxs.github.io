name: Notify Subscribers of New Content

on:
  push:
    branches: [ main ]
    paths:
      - "_posts/**"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install msmtp and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y msmtp jq

      - name: Configure msmtp
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          cat > ~/.msmtprc <<'EOF'
          account default
          host smtp.gmail.com
          port 587
          auth on
          tls on
          tls_starttls on
          user ${EMAIL_USER}
          password ${EMAIL_PASS}
          from ${EMAIL_USER}
          logfile ~/.msmtp.log
          EOF
          chmod 600 ~/.msmtprc

      - name: Detect new post
        id: detect
        shell: bash
        run: |
          # Find any brand-new post added in this push
          NEW_POST=$(git diff --name-only --diff-filter=A "${{ github.event.before }}" "${{ github.sha }}" -- '_posts/*.md' | head -n1)

          if [[ -z "$NEW_POST" ]]; then
            echo "No new post added - skipping notification."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract Title (handles quoted or unquoted)
          TITLE=$(sed -n 's/^title:[[:space:]]*"\{0,1\}\(.*\)"\{0,1\}$/\1/p' "$NEW_POST" | head -n1)

          # Prefer a front-matter permalink if present
          PERMALINK=$(sed -n 's/^permalink:[[:space:]]*\(.*\)$/\1/p' "$NEW_POST" | head -n1)

          if [[ -n "$PERMALINK" ]]; then
            URL="https://lxsoftroxs.github.io${PERMALINK}"
          else
            # Default Jekyll-style URL from filename
            FILENAME="${NEW_POST##*/}"
            STEM="${FILENAME%.md}"
            IFS='-' read -r YEAR MONTH DAY REST <<< "$STEM"
            SLUG="$REST"
            URL="https://lxsoftroxs.github.io/$YEAR/$MONTH/$DAY/$SLUG.html"
          fi

          echo "POST_TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "POST_URL=$URL"     >> "$GITHUB_ENV"
          echo "skip=false"        >> "$GITHUB_OUTPUT"

      - name: Send notification emails
        if: ${{ steps.detect.outputs.skip == 'false' }}
        env:
          FROM: ${{ secrets.EMAIL_USER }}
        shell: bash
        run: |
          # Build a deduped, lowercased list from subscribers.json (array of strings)
          if [[ -f subscribers.json ]]; then
            jq -r 'map(ascii_downcase) | unique | .[]' subscribers.json > /tmp/subs.txt || true
          fi

          if [[ ! -s /tmp/subs.txt ]]; then
            echo "No subscribers; nothing to send."
            exit 0
          fi

          EMAIL_RE='^[^[:space:]@]+@[^[:space:]]+\.[^[:space:]]+$'

          while IFS= read -r addr; do
            [[ "$addr" =~ $EMAIL_RE ]] || { echo "Skipping invalid: $addr"; continue; }

            {
              printf 'To: %s\n' "$addr"
              printf 'From: %s\n' "$FROM"
              printf 'Subject: %s\n' "New Post: ${POST_TITLE}"
              printf 'MIME-Version: 1.0\n'
              printf 'Content-Type: text/plain; charset=UTF-8\n'
              printf '\n'
              printf 'A new post just went live:\n\n'
              printf '%s\n' "${POST_TITLE}"
              printf '%s\n\n' "${POST_URL}"
              printf '(You are receiving this because you subscribed at https://lxsoftroxs.github.io/subscribe/.)\n'
            } | msmtp -a default -t

          done < /tmp/subs.txt
