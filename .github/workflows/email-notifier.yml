name: Notify Subscribers of New Content

on:
  push:
    branches: [ main ]
    paths:
      - "_posts/**"
  workflow_dispatch:
    inputs:
      post_path:
        description: "Path to post (e.g. _posts/2025-10-14-my-post.md). If empty, latest post is used."
        required: false
        type: string
      custom_url:
        description: "Override URL (optional)."
        required: false
        type: string
      subject_prefix:
        description: "Subject prefix (e.g., New Post, Update)."
        required: false
        default: "New Post"
        type: string
      custom_message:
        description: "Extra message appended to the email body (optional)."
        required: false
        type: string
      emails_csv:
        description: "Comma-separated recipients (overrides subscribers.json)."
        required: false
        type: string
      dry_run:
        description: "If true, do everything except send."
        required: false
        default: false
        type: boolean

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history for diffs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install msmtp and jq
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y msmtp jq

      - name: Configure msmtp
        shell: bash
        run: |
          set -e
          cat <<EOF > ~/.msmtprc
          account default
          host smtp.gmail.com
          port 587
          auth on
          tls on
          tls_starttls on
          user ${{ secrets.EMAIL_USER }}
          password ${{ secrets.EMAIL_PASS }}
          from ${{ secrets.EMAIL_USER }}
          logfile ~/.msmtp.log
          EOF
          chmod 600 ~/.msmtprc

      - name: Build recipient list
        id: recipients
        shell: bash
        env:
          INPUT_EMAILS: ${{ github.event.inputs.emails_csv }}
          SUBSCRIBER_EMAILS: ${{ secrets.SUBSCRIBER_EMAILS }}
        run: |
          set -e
          if [ -n "${INPUT_EMAILS:-}" ]; then
            echo "EMAIL_LIST=$INPUT_EMAILS" >> "$GITHUB_ENV"
            echo "source=override" >> "$GITHUB_OUTPUT"
          elif [ -n "${SUBSCRIBER_EMAILS:-}" ]; then
            # Parse JSON array from GitHub Secret
            emails=$(echo "${SUBSCRIBER_EMAILS}" | jq -r '.[]' | paste -sd, -)
            echo "EMAIL_LIST=$emails" >> "$GITHUB_ENV"
            echo "source=github-secret" >> "$GITHUB_OUTPUT"
          else
            echo "EMAIL_LIST=" >> "$GITHUB_ENV"
            echo "source=none" >> "$GITHUB_OUTPUT"
            echo "::warning::No subscriber emails found. Please set SUBSCRIBER_EMAILS secret."
          fi

      - name: Detect target post (push vs manual)
        id: detect
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_POST_PATH: ${{ github.event.inputs.post_path }}
          INPUT_CUSTOM_URL: ${{ github.event.inputs.custom_url }}
          INPUT_SUBJECT_PREFIX: ${{ github.event.inputs.subject_prefix }}
          INPUT_CUSTOM_MESSAGE: ${{ github.event.inputs.custom_message }}
        run: |
          set -e
          echo "::group::Detect target post"

          # --- helpers (no bashisms beyond plain bash) ---
          strip_inline_comment() { sed 's/[[:space:]]*#.*$//'; }
          strip_quotes_trim() { tr -d '"'\'' | awk '{$1=$1;print}'; }
          trim_quotes_once() {
            v="$1"; v="${v%\"}"; v="${v#\"}"; v="${v%\'}"; v="${v#\'}"; printf '%s' "$v";
          }
          ensure_leading_slash() {
            v="$1"; if [ -z "$v" ]; then printf ""; return; fi
            case "$v" in /*) printf "%s" "$v";; *) printf "/%s" "$v";; esac
          }

          SUBJECT_PREFIX="${INPUT_SUBJECT_PREFIX:-New Post}"
          echo "SUBJECT_PREFIX=$SUBJECT_PREFIX" >> "$GITHUB_ENV"
          echo "CUSTOM_MESSAGE=${INPUT_CUSTOM_MESSAGE:-}" >> "$GITHUB_ENV"

          # --- read _config.yml safely (strip inline # comments & quotes) ---
          SITE_URL=""
          BASEURL=""
          CONFIG_PERMALINK=""
          if [ -f _config.yml ]; then
            SITE_URL=$(sed -n 's/^url:[[:space:]]*//p' _config.yml | head -n1 | strip_inline_comment | strip_quotes_trim)
            BASEURL=$(sed -n 's/^baseurl:[[:space:]]*//p' _config.yml | head -n1 | strip_inline_comment | strip_quotes_trim)
            CONFIG_PERMALINK=$(sed -n 's/^permalink:[[:space:]]*//p' _config.yml | head -n1 | strip_inline_comment | strip_quotes_trim)
          fi

          # Fallback url if empty; normalize baseurl leading slash; ensure scheme
          [ -n "$SITE_URL" ] || SITE_URL="https://lxsoftroxs.github.io"
          if echo "$SITE_URL" | grep -qE '^//'; then SITE_URL="https:${SITE_URL}"; fi
          if ! echo "$SITE_URL" | grep -qE '^https?://'; then SITE_URL="https://$SITE_URL"; fi
          [ -n "$BASEURL" ] && BASEURL="$(ensure_leading_slash "$BASEURL")"

          # --- function to derive title and URL for a post ---
          resolve_title_and_url_file() {
            path="$1"
            fname="${path##*/}"; fname="${fname%.md}"
            year="${fname%%-*}"; rest="${fname#*-}"
            month="${rest%%-*}"; rest="${rest#*-}"
            day="${rest%%-*}"; slug="${rest#*-}"

            # front-matter lines (do not fail if missing)
            title_line=$(grep -m1 '^title:' "$path" || true)
            fm_perm_line=$(grep -m1 '^permalink:' "$path" || true)

            title_raw="$(printf '%s' "${title_line#title: }" | strip_inline_comment | strip_quotes_trim)"
            fm_perm_raw="$(printf '%s' "${fm_perm_line#permalink: }" | strip_inline_comment | strip_quotes_trim)"

            title="$(trim_quotes_once "${title_raw:-$fname}")"
            fm_perm="$(trim_quotes_once "${fm_perm_raw:-}")"

            # Build permalink preference: custom input -> front-matter -> config -> default
            if [ -n "${INPUT_CUSTOM_URL:-}" ]; then
              permalink="$INPUT_CUSTOM_URL"
            elif [ -n "$fm_perm" ]; then
              permalink="$fm_perm"
              case "$permalink" in
                http*://*) : ;;
                /*) : ;;
                *) permalink="/$permalink" ;;
              esac
            else
              case "$CONFIG_PERMALINK" in
                "/:year/:month/:day/:title/" )
                  permalink="/$year/$month/$day/$slug/";;
                "/:year/:month/:day/:title.html" )
                  permalink="/$year/$month/$day/$slug.html";;
                "/:title/" )
                  permalink="/$slug/";;
                "/:title.html" )
                  permalink="/$slug.html";;
                * )
                  permalink="/$year/$month/$day/$slug.html";;
              esac
            fi

            if echo "$permalink" | grep -qE '^https?://'; then
              POST_URL="$permalink"
            else
              case "$permalink" in /*) : ;; *) permalink="/$permalink" ;; esac
              POST_URL="${SITE_URL%/}${BASEURL%/}${permalink}"
            fi

            echo "POST_TITLE=$title" >> "$GITHUB_ENV"
            echo "POST_URL=$POST_URL" >> "$GITHUB_ENV"
          }

          # Return the latest post path by commit history; fallback to mtime
          pick_latest_post() {
            latest=""
            # This prints filenames line-by-line; we take the first match
            latest=$(git log --pretty=format: --name-only -- _posts/*.md | awk '/^_posts\/.*\.md$/ {print; exit}')
            if [ -z "$latest" ]; then
              latest=$(ls -t _posts/*.md 2>/dev/null | sed -n '1p')
            fi
            printf '%s' "$latest"
          }

          if [ "${EVENT_NAME:-}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_POST_PATH:-}" ]; then
              if [ ! -f "$INPUT_POST_PATH" ]; then
                echo "Error: post_path '$INPUT_POST_PATH' not found"; exit 1
              fi
              TARGET="$INPUT_POST_PATH"
            else
              TARGET="$(pick_latest_post)"
              if [ -z "$TARGET" ]; then
                echo "Error: No posts in _posts/"; exit 1
              fi
            fi
            echo "mode=manual" >> "$GITHUB_OUTPUT"
            echo "Target: $TARGET"
            resolve_title_and_url_file "$TARGET"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            exit 0
          fi

          # PUSH mode: only when a file was ADDED in this push
          NEW_POST=""
          if [ -n "${BEFORE:-}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            NEW_POST="$(git diff --name-only --diff-filter=A "$BEFORE" "$SHA" -- '_posts/*.md' | sed -n '1p' || true)"
          fi
          if [ -z "$NEW_POST" ]; then
            NEW_POST="$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$SHA" -- '_posts/*.md' | sed -n '1p' || true)"
          fi

          if [ -z "$NEW_POST" ]; then
            echo "No new post added in this push – skipping."
            echo "mode=push" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            exit 0
          fi

          echo "mode=push" >> "$GITHUB_OUTPUT"
          echo "Target (added): $NEW_POST"
          resolve_title_and_url_file "$NEW_POST"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Summary (what would be sent)
        shell: bash
        run: |
          set -e
          echo "Recipient source: ${{ steps.recipients.outputs.source }}"
          echo "Email count: $( [ -n "${EMAIL_LIST}" ] && echo "${EMAIL_LIST}" | awk -F',' '{print NF}' || echo 0 )"
          echo "Subject prefix: ${SUBJECT_PREFIX}"
          echo "Post title: ${POST_TITLE}"
          echo "Post URL: ${POST_URL}"
          echo "Mode: ${{ steps.detect.outputs.mode }}"
          echo "Dry run: ${{ github.event.inputs.dry_run }}"

      - name: Send notification email
        if: steps.detect.outputs.skip == 'false' && env.EMAIL_LIST != '' && github.event.inputs.dry_run != 'true'
        shell: bash
        env:
          SUBJECT_PREFIX: ${{ env.SUBJECT_PREFIX }}
          POST_TITLE: ${{ env.POST_TITLE }}
          POST_URL: ${{ env.POST_URL }}
          CUSTOM_MESSAGE: ${{ env.CUSTOM_MESSAGE }}
        run: |
          set -e
          # Convert comma-separated emails to space-separated for msmtp
          EMAIL_ARGS=$(echo "${EMAIL_LIST}" | tr ',' ' ')
          SUBJECT="${SUBJECT_PREFIX}: ${POST_TITLE}"
          {
            echo "Subject: ${SUBJECT}"
            echo
            echo "Check out the post: ${POST_TITLE}"
            echo "${POST_URL}"
            if [ -n "${CUSTOM_MESSAGE}" ]; then
              echo
              echo "${CUSTOM_MESSAGE}"
            fi
          } | msmtp -a default $EMAIL_ARGS
