name: Notify Subscribers of New Content

on:
  push:
    branches:
      - main
    paths:
      - "_posts/**"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      # 1) Full history so we can diff against github.event.before reliably
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install msmtp and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y msmtp jq

      - name: Configure msmtp
        run: |
          cat <<EOF > ~/.msmtprc
          account default
          host smtp.gmail.com
          port 587
          auth on
          tls on
          tls_starttls on
          user ${{ secrets.EMAIL_USER }}
          password ${{ secrets.EMAIL_PASS }}
          from ${{ secrets.EMAIL_USER }}
          logfile ~/.msmtp.log
          EOF
          chmod 600 ~/.msmtprc

      - name: Fetch subscribers
        run: |
          if [ -f subscribers.json ]; then
            emails=$(jq -r '.[]' subscribers.json | paste -sd, -)
            echo "EMAIL_LIST=$emails" >> $GITHUB_ENV
          else
            echo "EMAIL_LIST=" >> $GITHUB_ENV
          fi

      # Robust detection of newly ADDED post files in this push
      - name: Detect new post
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -e

          # Helper: is BEFORE a valid reachable commit?
          is_valid_before=false
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            is_valid_before=true
          fi

          NEW_POST=""
          if [ "$is_valid_before" = true ]; then
            # Case A: We have a valid 'before' -> diff the push range
            NEW_POST=$(git diff --name-only --diff-filter=A "$BEFORE" "$SHA" -- '_posts/*.md' | head -n1)
          fi

          if [ -z "$NEW_POST" ]; then
            # Case B: Fallback – detect files added in THIS commit (covers initial commits, force-pushes, or shallow anomalies)
            NEW_POST=$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$SHA" -- '_posts/*.md' | head -n1)
          fi

          if [ -z "$NEW_POST" ]; then
            echo "No new post added – skipping notification."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract title from YAML front matter (strip optional quotes)
          TITLE=$(grep -m1 '^title:' "$NEW_POST" | sed 's/^title:[[:space:]]*["'\'']\?\(.*\)["'\'']\?$/\1/')
          if [ -z "$TITLE" ]; then
            # Last resort: use filename slug if no title found
            TITLE=$(basename "$NEW_POST" .md)
          fi

          # Build URL: _posts/YYYY-MM-DD-slug.md → /YYYY/MM/DD/slug.html
          FILENAME=$(basename "$NEW_POST" .md)
          YEAR=$(echo "$FILENAME" | cut -d'-' -f1)
          MONTH=$(echo "$FILENAME" | cut -d'-' -f2)
          DAY=$(echo "$FILENAME" | cut -d'-' -f3)
          SLUG=$(echo "$FILENAME" | cut -d'-' -f4-)
          URL="https://lxsoftroxs.github.io/$YEAR/$MONTH/$DAY/$SLUG.html"

          echo "POST_TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "POST_URL=$URL"     >> "$GITHUB_ENV"
          echo "skip=false"        >> "$GITHUB_OUTPUT"

      - name: Send notification email
        if: steps.detect.outputs.skip == 'false' && env.EMAIL_LIST != ''
        run: |
          cat <<EOF | msmtp -a default "${{ env.EMAIL_LIST }}"
          Subject: New Post: ${POST_TITLE}

          Check out the new post: "${POST_TITLE}"
          ${POST_URL}
          EOF
