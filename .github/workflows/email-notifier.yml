name: Notify Subscribers of New Content

on:
  push:
    branches: [ main ]
    paths:
      - "_posts/**"
  workflow_dispatch:
    inputs:
      post_path:
        description: "Path to post (e.g. _posts/2025-10-14-my-post.md). If empty, latest post is used."
        required: false
        type: string
      custom_url:
        description: "Override URL (optional)."
        required: false
        type: string
      subject_prefix:
        description: "Subject prefix (e.g., New Post, Update)."
        required: false
        default: "New Post"
        type: string
      custom_message:
        description: "Extra message appended to the email body (optional)."
        required: false
        type: string
      emails_csv:
        description: "Comma-separated recipient list (overrides subscribers.json)."
        required: false
        type: string
      dry_run:
        description: "If true, do everything except send."
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history for diffs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install msmtp and jq
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y msmtp jq

      - name: Configure msmtp
        run: |
          set -e
          cat <<EOF > ~/.msmtprc
          account default
          host smtp.gmail.com
          port 587
          auth on
          tls on
          tls_starttls on
          user ${{ secrets.EMAIL_USER }}
          password ${{ secrets.EMAIL_PASS }}
          from ${{ secrets.EMAIL_USER }}
          logfile ~/.msmtp.log
          EOF
          chmod 600 ~/.msmtprc

      - name: Build recipient list
        id: recipients
        env:
          INPUT_EMAILS: ${{ github.event.inputs.emails_csv }}
        run: |
          set -e
          if [ -n "${INPUT_EMAILS:-}" ]; then
            echo "EMAIL_LIST=$INPUT_EMAILS" >> "$GITHUB_ENV"
            echo "source=override" >> "$GITHUB_OUTPUT"
          elif [ -f subscribers.json ]; then
            emails=$(jq -r '.[]' subscribers.json | paste -sd, -)
            echo "EMAIL_LIST=$emails" >> "$GITHUB_ENV"
            echo "source=subscribers.json" >> "$GITHUB_OUTPUT"
          else
            echo "EMAIL_LIST=" >> "$GITHUB_ENV"
            echo "source=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect target post (push vs manual)
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_POST_PATH: ${{ github.event.inputs.post_path }}
          INPUT_CUSTOM_URL: ${{ github.event.inputs.custom_url }}
          INPUT_SUBJECT_PREFIX: ${{ github.event.inputs.subject_prefix }}
          INPUT_CUSTOM_MESSAGE: ${{ github.event.inputs.custom_message }}
        run: |
          set -e
          echo "::group::Detect target post"

          # --- helpers ---
          strip_inline_comment() { sed 's/[[:space:]]*#.*$//' ; }
          strip_quotes_trim() { tr -d '"'\'' | awk '{$1=$1;print}'; }
          ensure_leading_slash() {
            local v="$1"
            if [ -z "$v" ]; then printf ""; return; fi
            case "$v" in
              /*) printf "%s" "$v" ;;
              *)  printf "/%s" "$v" ;;
            esac
          }
          trim_quotes() {
            local v="$1"
            v="${v%\"}"; v="${v#\"}"
            v="${v%\'}"; v="${v#\'}"
            printf '%s' "$v"
          }

          # Inputs / defaults
          SUBJECT_PREFIX="${INPUT_SUBJECT_PREFIX:-New Post}"
          echo "SUBJECT_PREFIX=$SUBJECT_PREFIX" >> "$GITHUB_ENV"
          echo "CUSTOM_MESSAGE=${INPUT_CUSTOM_MESSAGE:-}" >> "$GITHUB_ENV"

          # --- read _config.yml safely (strip inline # comments & quotes) ---
          SITE_URL=""
          BASEURL=""
          CONFIG_PERMALINK=""
          if [ -f _config.yml ]; then
            SITE_URL=$(sed -n 's/^url:[[:space:]]*//p' _config.yml | head -n1 | strip_inline_comment | strip_quotes_trim)
            BASEURL=$(sed -n 's/^baseurl:[[:space:]]*//p' _config.yml | head -n1 | strip_inline_comment | strip_quotes_trim)
            CONFIG_PERMALINK=$(sed -n 's/^permalink:[[:space:]]*//p' _config.yml | head -n1 | strip_inline_comment | strip_quotes_trim)
          fi

          # Fallback url if empty; normalize baseurl leading slash
          [ -n "$SITE_URL" ] || SITE_URL="https://lxsoftroxs.github.io"
          # If someone wrote //user.github.io, add scheme
          if echo "$SITE_URL" | grep -qE '^//'; then SITE_URL="https:${SITE_URL}"; fi
          # Ensure SITE_URL has scheme
          if ! echo "$SITE_URL" | grep -qE '^https?://'; then SITE_URL="https://$SITE_URL"; fi
          # Normalize baseurl to start with / (or empty)
          if [ -n "$BASEURL" ]; then BASEURL="$(ensure_leading_slash "$BASEURL")"; fi

          resolve_title_and_url() {
            local path="$1"
            local fname year month day slug title fm_perm permalink

            fname=$(basename "$path" .md)
            year=$(echo "$fname" | cut -d'-' -f1)
            month=$(echo "$fname" | cut -d'-' -f2)
            day=$(echo "$fname" | cut -d'-' -f3)
            slug=$(echo "$fname" | cut -d'-' -f4-)

            local title_line fm_perm_line title_raw fm_perm_raw
            title_line=$(grep -m1 '^title:' "$path" || true)
            fm_perm_line=$(grep -m1 '^permalink:' "$path" || true)

            title_raw=$(echo "${title_line#title: }" | strip_inline_comment | strip_quotes_trim)
            fm_perm_raw=$(echo "${fm_perm_line#permalink: }" | strip_inline_comment | strip_quotes_trim)

            title=$(trim_quotes "${title_raw:-$fname}")
            fm_perm=$(trim_quotes "${fm_perm_raw:-}")

            if [ -n "${INPUT_CUSTOM_URL:-}" ]; then
              permalink="$INPUT_CUSTOM_URL"
            elif [ -n "$fm_perm" ]; then
              permalink="$fm_perm"
              case "$permalink" in
                http*://*) ;; # absolute ok
                /*) ;;        # site-root ok
                *) permalink="/$permalink" ;;
              esac
            else
              case "$CONFIG_PERMALINK" in
                "/:year/:month/:day/:title/" )
                  permalink="/$year/$month/$day/$slug/";;
                "/:year/:month/:day/:title.html" )
                  permalink="/$year/$month/$day/$slug.html";;
                "/:title/" )
                  permalink="/$slug/";;
                "/:title.html" )
                  permalink="/$slug.html";;
                * )
                  permalink="/$year/$month/$day/$slug.html";;
              esac
            fi

            # Build final URL safely (no dup slashes; include scheme)
            if echo "$permalink" | grep -qE '^https?://'; then
              echo "POST_URL=$permalink" >> "$GITHUB_ENV"
            else
              # ensure permalink starts with /
              case "$permalink" in
                /*) ;; *) permalink="/$permalink" ;;
              esac
              local full="${SITE_URL%/}${BASEURL%/}${permalink}"
              echo "POST_URL=$full" >> "$GITHUB_ENV"
            fi
            echo "POST_TITLE=$title" >> "$GITHUB_ENV"
          }

          pick_latest_post() {
            # Most recent by commit history touching _posts; fallback mtime
            mapfile -t touched < <( git log --pretty=format: --name-only -- _posts/*.md | awk '/^_posts\/.*\.md$/' )
            if [ "${#touched[@]}" -gt 0 ]; then
              printf '%s\n' "${touched[0]}"
            else
              mapfile -t by_time < <( ls -t _posts/*.md 2>/dev/null || true )
              [ "${#by_time[@]}" -gt 0 ] && printf '%s\n' "${by_time[0]}"
            fi
          }

          if [ "${EVENT_NAME:-}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_POST_PATH:-}" ]; then
              [ -f "$INPUT_POST_PATH" ] || { echo "Error: post_path '$INPUT_POST_PATH' not found"; exit 1; }
              TARGET="$INPUT_POST_PATH"
            else
              TARGET="$(pick_latest_post)"
              [ -n "$TARGET" ] || { echo "Error: No posts in _posts/"; exit 1; }
            fi
            echo "mode=manual" >> "$GITHUB_OUTPUT"
            echo "Target: $TARGET"
            resolve_title_and_url "$TARGET"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            exit 0
          fi

          # PUSH mode: only when a file was ADDED in this push
          is_valid_before=false
          if [ -n "${BEFORE:-}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            is_valid_before=true
          fi

          NEW_POST=""
          if [ "$is_valid_before" = true ]; then
            mapfile -t added_range < <( git diff --name-only --diff-filter=A "$BEFORE" "$SHA" -- '_posts/*.md' || true )
            if [ "${#added_range[@]}" -gt 0 ]; then NEW_POST="${added_range[0]}"; fi
          fi
          if [ -z "$NEW_POST" ]; then
            mapfile -t added_commit < <( git diff-tree --no-commit-id --name-only --diff-filter=A -r "$SHA" -- '_posts/*.md' || true )
            if [ "${#added_commit[@]}" -gt 0 ]; then NEW_POST="${added_commit[0]}"; fi
          fi

          if [ -z "$NEW_POST" ]; then
            echo "No new post added in this push – skipping."
            echo "mode=push" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            exit 0
          fi

          echo "mode=push" >> "$GITHUB_OUTPUT"
          echo "Target (added): $NEW_POST"
          resolve_title_and_url "$NEW_POST"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Summary (what would be sent)
        run: |
          set -e
          echo "Recipient source: ${{ steps.recipients.outputs.source }}"
          echo "Email count: $( [ -n "${EMAIL_LIST}" ] && echo "${EMAIL_LIST}" | awk -F',' '{print NF}' || echo 0 )"
          echo "Subject prefix: ${SUBJECT_PREFIX}"
          echo "Post title: ${POST_TITLE}"
          echo "Post URL: ${POST_URL}"
          echo "Mode: ${{ steps.detect.outputs.mode }}"
          echo "Dry run: ${{ github.event.inputs.dry_run }}"

      - name: Send notification email
        if: steps.detect.outputs.skip == 'false' && env.EMAIL_LIST != '' && github.event.inputs.dry_run != 'true'
        env:
          SUBJECT_PREFIX: ${{ env.SUBJECT_PREFIX }}
          POST_TITLE: ${{ env.POST_TITLE }}
          POST_URL: ${{ env.POST_URL }}
          CUSTOM_MESSAGE: ${{ env.CUSTOM_MESSAGE }}
        run: |
          set -e
          SUBJECT="${SUBJECT_PREFIX}: ${POST_TITLE}"
          {
            echo "Subject: ${SUBJECT}"
            echo
            echo "Check out the post: ${POST_TITLE}"
            echo "${POST_URL}"
            if [ -n "${CUSTOM_MESSAGE}" ]; then
              echo
              echo "${CUSTOM_MESSAGE}"
            fi
          } | msmtp -a default "${EMAIL_LIST}"
