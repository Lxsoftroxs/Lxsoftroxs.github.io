<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔒 Secret Section</title>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
</head>
<body>
<h2>Enter password to unlock</h2>
<input id="pw" type="password" placeholder="Password">
<button id="unlock">Unlock</button>
<pre id="output"></pre>

<script>
async function decrypt() {
  const pw = document.getElementById('pw').value;
  const enc = await fetch('secret.enc').then(r => r.text());
  try {
    const bytes = CryptoJS.AES.decrypt(enc, pw);
    const text = bytes.toString(CryptoJS.enc.Utf8);
    if (!text) throw new Error();
    document.getElementById('output').textContent = text;
  } catch {
    document.getElementById('output').textContent = "❌ Wrong password.";
  }
}
document.getElementById('unlock').onclick = decrypt;
</script>
</body>
</html>
