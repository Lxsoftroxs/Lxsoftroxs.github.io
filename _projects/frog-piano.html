<div id="frog-piano-container">
  <h2>Frog Piano</h2>
  <p>Click or tap a key (or press A S D F G). If sound is blocked, tap "Enable Sound".</p>
  <button id="start-audio" style="display:none;margin-bottom:8px;">Enable Sound</button>
</div>

<!-- p5 core + sound addon (required for oscillators / WebAudio) -->
<script src="https://cdn.jsdelivr.net/npm/p5@1.4.2/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5@1.4.2/lib/addons/p5.sound.min.js"></script>

<script>
  // ---------- Config ----------
  const NOTE_MAP = [
    { name: "C", freq: 261.63, key: "a" },
    { name: "D", freq: 293.66, key: "s" },
    { name: "E", freq: 329.63, key: "d" },
    { name: "F", freq: 349.23, key: "f" },
    { name: "G", freq: 392.00, key: "g" }
  ];
  const PIANO_HEIGHT = 90;
  const HOP_VY = -11;
  const GRAVITY = 0.45;
  const MAX_VX = 6;
  const ATTACK = 0.02;   // seconds
  const RELEASE = 0.35;  // seconds

  // ---------- State ----------
  let keys = [];   // {x,y,w,h,note,activeUntil}
  let osc = null;  // p5.Oscillator (lazy-created)
  let frog = null; // {x,y,vx,vy,r,onGround}
  let keysY = 0;
  let cnv = null;

  function ensureAudioReady() {
    try { userStartAudio(); } catch(_) {}
    const ctx = (typeof getAudioContext === "function") ? getAudioContext() : null;
    if (ctx && ctx.state !== "running" && ctx.resume) ctx.resume();

    if (!osc) {
      // create oscillator only after a user gesture or explicit click
      osc = new p5.Oscillator("sine");
      osc.start();
      osc.amp(0);
    }
    const btn = document.getElementById("start-audio");
    if (btn) btn.style.display = "none";
  }

  function createOrResizeCanvas() {
    const container = document.getElementById("frog-piano-container");
    const maxW = Math.min((container && container.clientWidth) ? container.clientWidth : 600, 800);
    const w = Math.max(360, maxW);
    const h = Math.round(w * 0.66); // 3:2 aspect
    if (!cnv) {
      cnv = createCanvas(w, h);
      cnv.parent("frog-piano-container");
    } else {
      resizeCanvas(w, h);
    }
  }

  function buildKeyboard() {
    keys = [];
    keysY = height - PIANO_HEIGHT;
    const keyW = width / NOTE_MAP.length;
    for (let i = 0; i < NOTE_MAP.length; i++) {
      keys.push({
        x: i * keyW,
        y: keysY,
        w: keyW,
        h: PIANO_HEIGHT,
        note: NOTE_MAP[i],
        activeUntil: 0
      });
    }
  }

  function setup() {
    createOrResizeCanvas();
    buildKeyboard();

    frog = {
      x: width * 0.5,
      y: keysY - 20,
      vx: 0,
      vy: 0,
      r: 20,
      onGround: true
    };

    // Show "Enable Sound" if AudioContext is not running yet
    const btn = document.getElementById("start-audio");
    const ctx = (typeof getAudioContext === "function") ? getAudioContext() : null;
    if (btn && ctx && ctx.state !== "running") {
      btn.style.display = "inline-block";
      btn.addEventListener("click", ensureAudioReady);
    }

    // Avoid text selection while interacting
    const wrap = document.getElementById("frog-piano-container");
    if (wrap) wrap.onmousedown = (e) => e.preventDefault();
  }

  function windowResized() {
    createOrResizeCanvas();
    buildKeyboard();
    frog.y = Math.min(frog.y, keysY - frog.r);
  }

  function drawKeyboard() {
    textAlign(CENTER, CENTER);
    textSize(16);
    for (const k of keys) {
      const active = millis() < k.activeUntil;
      stroke(60);
      strokeWeight(2);
      fill(active ? 230 : 250);
      rect(k.x, k.y, k.w, k.h);
      noStroke();
      fill(40);
      text(k.note.name, k.x + k.w / 2, k.y + k.h - 22);
      fill(110);
      text(k.note.key.toUpperCase(), k.x + k.w / 2, k.y + k.h - 6);
    }
  }

  function drawFrog() {
    noStroke();
    fill(34, 180, 34);
    ellipse(frog.x, frog.y, frog.r * 2);
    // eyes
    fill(255);
    ellipse(frog.x - 7, frog.y - 10, 10, 10);
    ellipse(frog.x + 7, frog.y - 10, 10, 10);
    fill(0);
    ellipse(frog.x - 7, frog.y - 10, 4, 4);
    ellipse(frog.x + 7, frog.y - 10, 4, 4);
  }

  function physics() {
    if (!frog.onGround) {
      frog.vy += GRAVITY;
      frog.x  += frog.vx;
      frog.y  += frog.vy;

      // landing on the keys
      if (frog.y + frog.r >= keysY) {
        frog.y = keysY - frog.r;
        frog.vy = 0;
        frog.vx *= 0.4;
        frog.onGround = true;
      }

      // walls
      if (frog.x - frog.r < 0) { frog.x = frog.r; frog.vx *= -0.5; }
      if (frog.x + frog.r > width) { frog.x = width - frog.r; frog.vx *= -0.5; }
    }
  }

  function draw() {
    background(22);
    drawKeyboard();
    physics();
    drawFrog();

    // HUD
    fill(200);
    noStroke();
    textAlign(CENTER);
    textSize(14);
    text("Click keys or press A S D F G", width / 2, 24);
  }

  function activateKey(i) {
    const k = keys[i];
    if (!k) return;

    ensureAudioReady();
    if (osc) {
      osc.freq(k.note.freq);
      osc.amp(0.6, ATTACK);
    }
    k.activeUntil = millis() + 150;

    // hop towards this key
    const targetX = k.x + k.w / 2;
    const dx = targetX - frog.x;
    frog.vx = constrain(dx / 12, -MAX_VX, MAX_VX);
    frog.vy = HOP_VY - random(0, 2.5);
    frog.onGround = false;
  }

  // Mouse / touch
  function mousePressed() {
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      if (mouseX > k.x && mouseX < k.x + k.w && mouseY > k.y && mouseY < k.y + k.h) {
        activateKey(i);
        break;
      }
    }
    return false;
  }
  function mouseReleased() { if (osc) osc.amp(0, RELEASE); }
  function touchStarted()  { return mousePressed(); }
  function touchEnded()    { mouseReleased(); return false; }

  // Keyboard (A S D F G)
  function keyPressed() {
    const ch = (key || "").toLowerCase();
    const idx = NOTE_MAP.findIndex(n => n.key === ch);
    if (idx >= 0) activateKey(idx);
  }
  function keyReleased() {
    const ch = (key || "").toLowerCase();
    if (NOTE_MAP.some(n => n.key === ch)) { if (osc) osc.amp(0, RELEASE); }
  }
</script>
