---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">Posted on {{ page.date | date: "%B %-d, %Y" }}</p>

  <section class="interactive-flow" aria-label="Interactive text flow demo">
    <div class="interactive-flow-header">
      <strong>Interactive flow objects</strong>
      <button type="button" class="flow-reset" data-flow-reset>Reset objects</button>
    </div>
    <p class="interactive-flow-hint">Drag the circles. The post text wraps around them live.</p>
  </section>

  <div class="post-content" data-flow-content>
    {{ content }}
  </div>
</article>
<hr>
<section id="comments">
  <script src="https://utteranc.es/client.js"
          repo="lxsoftroxs/lxsoftroxs.github.io"
          issue-term="pathname"
          theme="github-dark"
          crossorigin="anonymous"
          async>
  </script>
</section>
