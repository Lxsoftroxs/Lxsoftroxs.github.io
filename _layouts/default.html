<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Content Security Policy for XSS Protection -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://utteranc.es; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://utteranc.es https://api.github.com https://ws.audioscrobbler.com https://subscriber-api-lolroxs.vercel.app; frame-src https://utteranc.es;">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{{ page.title }} - {{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 155 }}">
  <meta property="og:title" content="{{ page.title }} - {{ site.title }}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 200 }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/images/gallery/20250610_12370213.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }} - {{ site.title }}">
  <meta name="twitter:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 200 }}">
  <meta name="twitter:image" content="{{ page.image | default: '/assets/images/gallery/20250610_12370213.jpg' | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="no-flash">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  {% include header.html %}
  <div id="main-content" class="container">
    {{ content }}
  </div>
  {% include footer.html %}
  <script defer src="{{ '/assets/js/site-optimizations.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/pretext-flow.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/no-flash.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/nav.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/footer-subscribe.js' | relative_url }}"></script>
</body>
</html>
