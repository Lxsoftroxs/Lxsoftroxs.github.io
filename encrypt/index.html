<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Encrypt Text</title>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
<style>
body { font-family: sans-serif; max-width: 700px; margin: auto; padding: 2rem; }
textarea { width: 100%; height: 150px; }
button { padding: .5rem 1rem; margin-top: .5rem; }
</style>
</head>
<body>
<h2>🧩 Encrypt Text (Local Only)</h2>
<p>This page runs only in your browser — no data leaves your device.</p>
<textarea id="plain" placeholder="Paste your text here..."></textarea><br>
<input id="pw" type="password" placeholder="Password"><br>
<button onclick="encrypt()">Encrypt</button>

<h3>Encrypted Output</h3>
<textarea id="out" readonly></textarea>

<script>
function encrypt(){
  const plain = document.getElementById('plain').value;
  const pw = document.getElementById('pw').value;
  if(!plain || !pw){
    alert('Enter both text and password.');
    return;
  }
  const cipher = CryptoJS.AES.encrypt(plain, pw).toString();
  document.getElementById('out').value = cipher;
}
</script>
</body>
</html>
